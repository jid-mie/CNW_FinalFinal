services:
  - type: web
    name: playmanagement-web
    env: docker
    dockerfilePath: Dockerfile.render
    plan: free
    domains:
      - nmh3105.id.vn
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://nmh3105.id.vn
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: playmanagement-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: playmanagement-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: playmanagement-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: playmanagement-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: playmanagement-db
          property: password
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: ssl
      - key: MAIL_FROM_ADDRESS
        value: hiepnguyendev315@gmail.com
      - key: MAIL_FROM_NAME
        value: VenuePro

databases:
  - name: playmanagement-db
    plan: free
